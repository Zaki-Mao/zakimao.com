<!DOCTYPE html>

<head>

    <title>ZAKI | Visual Designer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

    <main class="hero-wrapper">

            <span class="letter">z</span>
            <span class="letter">a</span>

        <div class="content-area">
            <p class="subtitle-text">
                Creative Director & Visual Designer<br>
                Based in Shanghai
            </p>
            <a href="#" class="pill-button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                Explore Work

        <div class="photo-pile-container">
            <div class="photo-card" style="--left: 10%; --rot: -12deg; --y: 20px; background-image: url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=400&q=80');"></div>

            <div class="photo-card" style="--left: 70%; --rot: 15deg; --y: 30px; background-image: url('https://images.unsplash.com/photo-1534237710431-e2fc698436d0?auto=format&fit=crop&w=400&q=80');"></div>
        </div>

    </main>
