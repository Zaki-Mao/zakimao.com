<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAKI | Visual Designer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <main class="hero-wrapper">
        
        <h1 class="huge-title">
            <span class="letter">Z</span>
            <span class="letter">A</span>
            <span class="letter">K</span>
            <span class="letter">I</span>
        </h1>

        <div class="content-area">
            <p class="subtitle-text">
                Creative Director & Visual Designer<br>
                Based in Shanghai
            </p>
            
            <a href="#" class="pill-button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
                Explore Work
            </a>
        </div>

        <div class="photo-pile-container">
            <div class="photo-card" style="--rot: -10deg; --x: -180px; --y: 30px; background-image: url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=600');"></div>
            <div class="photo-card" style="--rot: -4deg; --x: -60px; --y: 60px; z-index: 2; background-image: url('https://images.unsplash.com/photo-1486325212027-8081e485255e?w=600');"></div>
            <div class="photo-card" style="--rot: 5deg; --x: 60px; --y: 20px; z-index: 3; background-image: url('https://images.unsplash.com/photo-1523217582562-09d0def993a6?w=600');"></div>
            <div class="photo-card" style="--rot: 12deg; --x: 180px; --y: 50px; z-index: 2; background-image: url('https://images.unsplash.com/photo-1501183638710-841dd1904471?w=600');"></div>
        </div>

    </main>

    <div class="fab-menu">⋮</div>

</body>
</html>
